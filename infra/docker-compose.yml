name: hagz

services:
  # PostGIS, multi-arch (the official postgis/postgis image is amd64 only). Match the tag to the PostGIS version on Neon.
  postgres:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: hagz
      POSTGRES_PASSWORD: hagz
      POSTGRES_DB: hagz
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # BullMQ needs keys to never be evicted.
  queue:
    image: redis:7
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - queue-data:/data

  # Cache only: evicts least-recently-used keys when full.
  cache:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"

volumes:
  postgres-data:
  queue-data:
