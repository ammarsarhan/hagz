name: Railway

# Plans .railway/railway.ts on PRs and applies it when merged into staging or main.
# PRs into dev and staging plan against the staging environment; PRs into main plan against production.

on:
  pull_request:
    branches: [dev, staging, main]
    paths: [".railway/**", ".github/workflows/railway.yml"]
  push:
    branches: [staging, main]
    paths: [".railway/**", ".github/workflows/railway.yml"]

# Never cancel a running apply; queue per target branch instead.
concurrency:
  group: railway-${{ github.event_name == 'push' && github.ref_name || github.base_ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  RAILWAY_CLI_VERSION: 5.63.1
  NO_COLOR: "1"

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
      RAILWAY_TOKEN: ${{ github.base_ref == 'main' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Plan against ${{ env.TARGET }}
        run: |
          set -o pipefail
          railway config plan --verbose 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- railway-plan -->"
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          body="$(printf '%s\n### Railway plan: `%s`\n\n```\n%s\n```\n' "$marker" "$TARGET" "$(tail -c 60000 plan.txt 2>/dev/null || echo 'Plan did not run.')")"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

  apply:
    name: Apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      RAILWAY_TOKEN: ${{ github.ref_name == 'main' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"

      # Without --confirm-destructive, destructive changes fail here and must be applied by hand.
      - name: Apply to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: railway config apply --yes
